# Build & push Cloud Run images. Substitute _PROJECT / _REGION before use.
substitutions:
  _REGION: asia-south1
  _API_SERVICE: suffai-api
  _WORKER_SERVICE: suffai-extraction

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_API_SERVICE}:$SHORT_SHA", "-f", "Dockerfile.api", "."]

  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_WORKER_SERVICE}:$SHORT_SHA", "-f", "Dockerfile.worker", "."]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_API_SERVICE}:$SHORT_SHA"]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_WORKER_SERVICE}:$SHORT_SHA"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_API_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=ENVIRONMENT=staging,DEMO_AUTH_ENABLED=true

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WORKER_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_WORKER_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_API_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_WORKER_SERVICE}:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
