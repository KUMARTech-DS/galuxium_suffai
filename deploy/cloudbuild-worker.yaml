# gcloud builds submit --config=deploy/cloudbuild-worker.yaml .
substitutions:
  _REGION: asia-south1
  _IMAGE: suffai-extraction

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_IMAGE}:latest
      - -f
      - Dockerfile.worker
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/suffai/${_IMAGE}:latest

timeout: 1200s
